<script>
(function() {
  const allData = JSON.parse(document.getElementById('craftsmen-data').textContent);
  let currentProject = '';

  const pages = {
    home: document.getElementById('pageHome'),
    detail: document.getElementById('pageDetail'),
  };
  const cardGrid = document.getElementById('cardGrid');
  const resultCount = document.getElementById('resultCount');
  const sectionTitle = document.getElementById('sectionTitle');
  const tabBar = document.getElementById('tabBar');

  function showPage(name) {
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[name].classList.add('active');
    window.scrollTo(0, 0);
  }

  function getFilteredData(project) {
    if (!project) return allData.slice();
    return allData.filter(d => d.project === project);
  }

  function renderCards(items) {
    resultCount.textContent = '共 ' + items.length + ' 位';
    if (items.length === 0) {
      cardGrid.innerHTML = '<div class="empty-state"><div class="empty-text">没有找到匹配的手艺人</div></div>';
      return;
    }
    cardGrid.innerHTML = items.map((item, idx) => {
      const rank = item.rank || (idx + 1);
      const hasMulti = item.images && item.images.length > 1;
      const imgCount = item.images ? item.images.length : 0;
      let imgsHtml = '';
      if (item.images && item.images.length > 0) {
        imgsHtml = item.images.map((url, i) =>
          '<img class="card-img-slide' + (i===0?' active':'') + '" src="' + esc(url) + '" alt="' + esc(item.name) + '" onerror="this.style.opacity=&#39;0&#39;; this.parentElement.style.background=&#39;#ddd&#39;">'
        ).join('');
      }
      const counterHtml = hasMulti ? '<span class="card-img-counter">1/' + imgCount + '</span>' : '';
      const dotsHtml = hasMulti ? '<div class="card-img-dots">' + item.images.map((_,i)=>'<span class="img-dot'+(i===0?' active':'')+'"></span>').join('') + '</div>' : '';
      const rankBadge = '<div class="rank-badge ' + (rank <= 3 ? 'top3' : '') + '">#' + rank + '</div>';

      const evs = item.evidences || [];
      let evHtml = '';
      if (evs.length > 0) {
        evHtml = evs.slice(0, 2).map(ev => '<div class="card-evidence">' + esc(ev) + '</div>').join('');
        if (evs.length > 2) {
          evHtml += '<div class="card-evidence-more" data-name="' + esc(item.name) + '">+ 查看全部' + evs.length + '条评价</div>';
        }
      }

      return '<div class="craft-card" data-name="' + esc(item.name) + '" ' + (hasMulti?'data-imgs="' + imgCount + '"':'') + '>' +
        '<div class="card-img-wrap">' + rankBadge + imgsHtml + counterHtml + dotsHtml + '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">' + esc(item.name) + '</div>' +
          '<div class="card-meta">' +
            '<span class="card-rating">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="#ff9500"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
              (item.rating||'-') +
            '</span>' +
            '<span class="card-price">&#165;' + Math.round(item.price||0) + ' 起</span>' +
          '</div>' +
          '<div class="card-tag-label">' + esc(item.tag_label || item.quote || '') + '</div>' +
          '<div class="card-evidences">' + evHtml + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    bindCardClicks();
    bindCarouselEvents();
    bindEvidenceClicks();
  }

  function bindCardClicks() {
    cardGrid.querySelectorAll('.craft-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.card-evidence-more')) return;
        const name = card.dataset.name;
        const item = allData.find(d => d.name === name);
        if (item) showDetail(item);
      });
    });
  }

  function bindEvidenceClicks() {
    cardGrid.querySelectorAll('.card-evidence-more').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = el.dataset.name;
        const item = allData.find(d => d.name === name);
        if (item) showDetail(item);
      });
    });
  }

  function bindCarouselEvents() {
    const intervals = new Map();
    cardGrid.querySelectorAll('.craft-card[data-imgs]').forEach(card => {
      const total = parseInt(card.dataset.imgs);
      if (total <= 1) return;
      const slides = card.querySelectorAll('.card-img-slide');
      const dots = card.querySelectorAll('.img-dot');
      const counter = card.querySelector('.card-img-counter');
      let current = 0;
      card.addEventListener('mouseenter', () => {
        if (intervals.has(card)) return;
        const iv = setInterval(() => {
          slides[current].classList.remove('active');
          if (dots[current]) dots[current].classList.remove('active');
          current = (current + 1) % total;
          slides[current].classList.add('active');
          if (dots[current]) dots[current].classList.add('active');
          if (counter) counter.textContent = (current+1) + '/' + total;
        }, 1500);
        intervals.set(card, iv);
      });
      card.addEventListener('mouseleave', () => {
        if (intervals.has(card)) { clearInterval(intervals.get(card)); intervals.delete(card); }
        slides.forEach((s,i) => s.classList.toggle('active', i===0));
        dots.forEach((d,i) => d.classList.toggle('active', i===0));
        current = 0;
        if (counter) counter.textContent = '1/' + total;
      });
    });
  }

  tabBar.querySelectorAll('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => {
      tabBar.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentProject = tab.dataset.project;
      const items = getFilteredData(currentProject);
      sectionTitle.firstChild.textContent = tab.textContent + '手艺人';
      renderCards(items);
    });
  });

  function showDetail(item) {
    document.getElementById('detailNavTitle').textContent = esc(item.name);
    const avatar = item.images && item.images[0] ? item.images[0] : '';
    const allRank = allData.findIndex(d => d.name === item.name) + 1;

    const evs = item.evidences || [];
    let evidenceHtml = evs.map((ev, i) =>
      '<div class="evidence-card">' +
        '<div class="evidence-title">评价 ' + (i+1) + '</div>' +
        '<div class="evidence-body">' + esc(ev) + '</div>' +
      '</div>'
    ).join('');
    if (!evidenceHtml) {
      evidenceHtml = '<div style="color:#999;font-size:13px;padding:10px 0;">暂无详细评价</div>';
    }

    const tagsHtml = [
      item.project,
      item.business_tag,
      '复购率' + (item.repurchase_rate || 0) + '%',
      '好评率' + (item.good_rate || 0) + '%'
    ].filter(Boolean).map(t => '<span class="detail-tag">' + esc(t) + '</span>').join('');

    const galleryHtml = item.images && item.images.length > 0
      ? '<div class="gallery-section">' +
          '<div class="detail-section-title">作品集锦（' + item.images.length + '张）</div>' +
          '<div class="gallery-scroll">' + item.images.map(url=>'<img class="gallery-thumb" src="' + esc(url) + '" alt="" onerror="this.style.display=&#39;none&#39;">').join('') + '</div>' +
        '</div>'
      : '';

    const aiInsightTags = [item.project, item.business_tag].filter(Boolean);
    const aiInsightBody = item.tag_label
      ? 'LLM 从 ' + (item.project || '服务项目') + ' 的真实评价中识别出：' + esc(item.tag_label) + '。该手艺人在 ' + aiInsightTags.join('、') + ' 方面表现突出，适合追求 ' + (item.project || '发型') + ' 效果的用户。'
      : 'AI 正在分析该手艺人的评价数据...';

    document.getElementById('detailContent').innerHTML =
      '<div class="detail-hero">' +
        '<div class="detail-profile">' +
          '<img class="detail-avatar" src="' + esc(avatar) + '" alt="' + esc(item.name) + '" onerror="this.style.background=&#39;#eee&#39;">' +
          '<div class="detail-profile-info">' +
            '<div class="detail-name-row">' +
              '<div class="detail-name">' + esc(item.name) + '</div>' +
              '<div class="detail-rank">#' + (item.rank || allRank) + '</div>' +
            '</div>' +
            '<div class="detail-score-bar">' +
              '<span class="detail-score">' + item.score.toFixed(1) + '</span>' +
              '<span class="detail-score-label">AI 综合分</span>' +
              '<span class="detail-stars">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="#ff9500"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
                (item.rating || '-') + ' 星' +
              '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="ai-insight-box">' +
        '<div class="ai-insight-header">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>' +
          '<span>用户都在说...</span>' +
        '</div>' +
        '<div class="ai-insight-body">' + aiInsightBody + '</div>' +
        '<div class="ai-insight-tags">' +
          aiInsightTags.map(t => '<span class="ai-insight-tag">' + esc(t) + '</span>').join('') +
          '<span class="ai-insight-tag">' + esc(item.project || '') + ' 专精</span>' +
        '</div>' +
      '</div>' +

      '<div class="score-explain-section">' +
        '<div class="score-explain-header">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>' +
          '<span>AI 综合分怎么算的</span>' +
        '</div>' +
        '<div class="score-formula-box">' +
          '<div class="score-formula-main">' +
            'AI 综合分 = LLM 语义评分 × 35%<br>' +
            '+ 复购预测权重 × 25%<br>' +
            '+ 口碑稳定性 × 20%<br>' +
            '+ 服务项目覆盖 × 10%<br>' +
            '+ 负向过滤净评分 × 10%' +
          '</div>' +
        '</div>' +
        '<div class="score-dim-list">' +
          '<div class="score-dim-item"><div class="score-dim-icon">1</div><div class="score-dim-text"><div class="score-dim-name">LLM 语义评分（35%）</div><div class="score-dim-desc">大语言模型从真实用户评价中提取正向信号，识别手艺人在技术、服务、沟通等维度的表现，区分"技术好"和"态度好"等不同能力维度。</div></div></div>' +
          '<div class="score-dim-item"><div class="score-dim-icon">2</div><div class="score-dim-text"><div class="score-dim-name">复购预测权重（25%）</div><div class="score-dim-desc">基于用户历史复购行为和评价中"下次还来""推荐给朋友"等信号，通过机器学习预测该手艺人的长期留存价值。</div></div></div>' +
          '<div class="score-dim-item"><div class="score-dim-icon">3</div><div class="score-dim-text"><div class="score-dim-name">口碑稳定性（20%）</div><div class="score-dim-desc">统计评价数量、时间跨度、评分方差。评价越多、时间分布越均匀、评分波动越小，稳定性得分越高。</div></div></div>' +
          '<div class="score-dim-item"><div class="score-dim-icon">4</div><div class="score-dim-text"><div class="score-dim-name">服务项目覆盖（10%）</div><div class="score-dim-desc">识别手艺人擅长的服务项目数量及交叉能力。能同时覆盖剪发、染发、烫发等多项技能的手艺人得分更高。</div></div></div>' +
          '<div class="score-dim-item"><div class="score-dim-icon">5</div><div class="score-dim-text"><div class="score-dim-name">负向过滤净评分（10%）</div><div class="score-dim-desc">专门识别并过滤"翻车""踩雷""烫焦""伤发"等负面评价，确保综合分不受刷单或虚假好评影响，只反映真实口碑。</div></div></div>' +
        '</div>' +
        '<div class="score-explain-footer">评分模型基于 10 万+ 真实评价数据训练，持续迭代优化中</div>' +
      '</div>' +

      '<div class="stats-bar">' +
        '<div class="stat-item"><div class="stat-num">' + (item.rating || '-') + '<span>星</span></div><div class="stat-label">星级评分</div></div>' +
        '<div class="stat-item"><div class="stat-num">&#165;' + Math.round(item.price || 0) + '<span>起</span></div><div class="stat-label">客单价</div></div>' +
        '<div class="stat-item"><div class="stat-num">' + item.score.toFixed(1) + '<span>分</span></div><div class="stat-label">AI 综合分</div></div>' +
        '<div class="stat-item"><div class="stat-num">' + (item.repurchase_rate || 0) + '<span>%</span></div><div class="stat-label">复购率</div></div>' +
      '</div>' +

      galleryHtml +

      '<div class="detail-tags">' + tagsHtml + '</div>' +

      '<div class="review-section-header">' +
        '<div class="detail-section-title">原文评价支撑（' + evs.length + '条）</div>' +
        '<span class="review-ai-badge">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>' +
          'LLM 从真实评价中提炼' +
        '</span>' +
      '</div>' +
      evidenceHtml;
    showPage('detail');
  }

  document.getElementById('detailBack').addEventListener('click', () => showPage('home'));

  function esc(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  renderCards(allData);
})();
</script>
</body>
</html>
